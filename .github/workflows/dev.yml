name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Elisp syntax check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: '30.2'

      - name: Check parens and syntax
        run: |
          for f in init.el early-init.el lisp/init-*.el; do
            emacs --batch --eval \
              "(condition-case err (with-temp-buffer (insert-file-contents \"$f\") (emacs-lisp-mode) (check-parens)) (error (progn (message \"SYNTAX ERROR in $f: %s\" (error-message-string err)) (kill-emacs 1))))"
          done
          echo "All elisp files pass syntax check."

  build:
    name: "Emacs ${{ matrix.emacs-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs-version:
          - '30.2'
          - snapshot
        include:
          - os: macos-latest
            emacs-version: '30.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Cache straight.el repositories
        uses: actions/cache@v4
        with:
          path: |
            straight/repos/
            straight/build/
          key: ${{ runner.os }}-emacs-${{ matrix.emacs-version }}-${{ hashFiles('straight/versions/default.el') }}
          restore-keys: |
            ${{ runner.os }}-emacs-${{ matrix.emacs-version }}-

      - name: Check startup
        run: ./test-startup.sh
